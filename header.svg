<svg xmlns="http://www.w3.org/2000/svg" width="850" height="100" viewBox="0 0 850 100">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#0d1117" rx="10" />

  <g font-family="'Courier New', monospace" font-size="26" font-weight="bold" fill="#00ff00" filter="url(#glow)">
    
    <text x="30" y="55">&gt; INIT SYSTEM...</text>

    <text x="425" y="55" text-anchor="middle" opacity="1">
      Welcome!
      <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.7;1" dur="3.5s" fill="freeze" />
    </text>

    <text x="425" y="55" text-anchor="middle" opacity="0">
      I'm Mayank Sethiya
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.9;1" dur="3.8s" fill="freeze" />
    </text>

  </g>
</svg>
